<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAY</title>
</head>
<body><h2>
    <script>
        var a = [1,2,3]
        a.push(4)                                     // add element at last
        document.write(a)                            // [1,2,3,4]
        a.pop()                                     // remove last element 
        document.write("<br>"+a)                   // [1,2,3]
        a.unshift(0)                              // add element at first
        document.write("<br>"+a)                 // [0,1,2,3]
        a.shift()                               // remove first element
        document.write("<br>"+a)               // [1,2,3]
        a.unshift(2)                                               
        document.write("<br>"+a)             // [2,1,2,3]
        document.write("<br>"+a.length)     // length of array
    </script>
    </h2>
</body>
</html>

</body>
</html>
