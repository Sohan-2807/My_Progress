<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>while and Do-while></title>
    <script>
        var i=1;
        while(i<=10)
        {
            document.write(i+" ");
            i++;
        }

        document.write("<br>");

        var j=1;
        do { document.write(j+" ");
        j++;
        } while (j<=10);
        
    </script>
</head>
<body>
    
</body>
</html>
