<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops</title>
    <script>
        for (i = 0; i <= 10; i++)
            if (i % 2 == 0) {
                document.write(i + "<br>");
            }

        document.write("<br>");

        for (i = 0; i <= 10; i++)
            if (i % 2 != 0) {
                document.write(i + "<br>");
            }

        document.write("<br>");

        for (i = 0; i <= 10; i += 2) {
            document.write(i + "<br>");
        }

    </script>
</head>

<body>

</body>

</html>
