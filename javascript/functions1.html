<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>functions</title>
</head>
<body>
    <script>
        function fun(a,b)
        {             //function declaration
            document.write("This is a function");   //statement inside function
            document.write("<br>");
            alert("This is a function");  //popup alert
            document.write("Sum is: " + (a + b)); 
            document.write("<br>"); 
            document.write("Product is: ", a * b);
        }
        fun(100,20); // calling function
    </script>
</body>
</html>
