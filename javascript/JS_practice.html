<!DOCTYPE html>
<html>

<head>
    <title>PRACTICE</title>
</head>

<body>

    <h2>PRACTICE</h2>

    <script>
        // printing output
        document.write("Hello, JavaScript!<br><br>");

      
        let a = 10;
        let b = 5;

        // addition
        let sum = a + b;
        document.write("Sum = " + sum + "<br><br>");

        // if - else
        if (sum > 10) {
            document.write("Sum is greater than 10<br><br>");
        } else {
            document.write("Sum is not greater than 10<br><br>");
        }

        // loop
        document.write("Counting:<br>");
        for (let i = 1; i <= 5; i++) {
            document.write(i + "<br>");
        }

        // popup
        alert("My Code");
    </script>

</body>

</html>
