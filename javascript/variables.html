<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables in Java</title>       <!--3types of variables 1.var  2.let  3.const-->
    <script>
        var a = "sohan"                       //assignment operator
        a = "abc"                            //re-assignment
        var a = "re-declared"               //re-declaration  
        document.write(a)
        
        let b = "xyz"
        b = "re-assigned"                    //can be re-assigned
        // let b = "re-declared"            //cannot be re-declared no output(error)
        document.write(b) 

        const c=9 
        c = 10                    //re-assignment and re-declaration is not possible
        document.write(c)
    </script>
</head>
<body>
    
</body>
</html>
