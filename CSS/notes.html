<!-- 
 div tag is block level 
 div tag takes entire width
 span tag is inline
 span tag takes only necessary width
 only as much needed
 div tag is mainly used to style large portion
 span tag is used to style small portion  
 inline: does not start on a new line and only takes up as much width as necessary.
 block: starts on a new line and takes up the full width available.
 examples:
   block: div, h1-h6, p, blockquote, ul, ol, li, table
   inline: span, a, img, strong, em, br
   marquee: deprecated tag, not recommended for use in modern web development.
   it creates a scrolling text or image effect.
   it is inline by default.
display property in css can be used to change the default behavior of elements.
types:
   display: block;
   display: inline; 
   display: inline-block;
   display: none; (hides the element)
   display: flex; (for flexbox layout)
   display: grid; (for grid layout)   
position property in css is used to specify the positioning method of an element.
types: 
   static: default value, elements are positioned according to the normal flow of the document.
   relative: element is positioned relative to its normal position.
   absolute: element is positioned relative to its nearest positioned ancestor (not static).
   fixed: element is positioned relative to the browser window, stays in the same place even during scrolling.
   sticky: element is treated as relative until it crosses a specified threshold, then it is treated as fixed.  
 -->
