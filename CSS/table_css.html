<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table in CSS</title>
    <style>
        table,th,tr,td
        {
            border: 2px solid;
            border-collapse: collapse;
            
        }
        /* th{
            background-color: aqua;
            color: chocolate;    */
        
        tr:hover{
            cursor:zoom-in;
            /* transform: rotate(90deg); */
            background-color: brown;
            /* transition: 0.01ms; */
            font-size: 30px;
        }
        tr:nth-child(odd){
            background-color: chocolate;
        }
        tr:nth-child(even){
            background-color: blueviolet;
            color: rgb(14, 15, 15);
        }
        
    </style>
</head>
<body>
    <table >
        <tr>
            <th>sno</th>
            <th>name</th>
            <th>Roll number</th>
        </tr>
        <tr>
            <td>1</td>
            <td>sohan</td>
            <td>K25NZ</td>
        </tr>
        <tr>
            <td>2</td>
            <td>name2</td>
            <td>K25NZ</td>
        </tr>
        <tr>
            <td>3</td>
            <td>name3</td>
            <td>K25NZ</td   >
        </tr>

    </table>
</body>
</html>
