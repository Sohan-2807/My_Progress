<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        body {
            background-color: rgb(28, 26, 26);
        }

        .move {
            position: relative;
            animation-name: example;
            animation-duration: 11s;
            animation-iteration-count: infinite;
        }

        @keyframes example {
            0%   {left:0px; top:0px;}
            10%  {left:800px; top:200px;}
            15%  {left:900px; top:300px;}
            25%  {left:400px; top:30px;}
            30%  {left:400px; top:300px;}
            40%  {left:200px; top:400px;}
            45%  {left:300px; top:700px;}
            50%  {left:600px; top:500px;}
            55%  {left:200px; top:100px;}
            60%  {left:700px; top:400px;}
            65%  {left:100px; top:300px;}
            75%  {left:900px; top:500px;}
            90%  {left:500px; top:10px;}
            100% {left:900px; top:8px;}
        }
        body{
            background-image: url(background.png);
            background-size: cover;
            /* background-position: center; */
        }
        
    </style>
</head>

<body>

    <img src="shahid_img.jpg" alt="Bird" class="move" id="img"
         style="width: 100px;height: 100px; border: 5px solid rgb(37, 34, 34); border-radius: 10px;">

    <audio src="flappy_bird.mp3" id="sound"></audio>
    <video src=""id="video"></video>


    
    <script>
        alert("catch me if u can");
        document.getElementById("img").onclick = function () {
            

            var sound = document.getElementById("sound");
            sound.play();
            alert("OK BYE BYE");

            
        }
    </script>

</body>
</html>
