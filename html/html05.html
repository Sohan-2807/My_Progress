<!DOCTYPE html>
<html>
<head>
    <title>My Simple Webpage</title>
</head>
<body>

    <h1>Welcome to My Webpage</h1>
    <p>This is a basic HTML page without any CSS.</p>

    <hr>

    <h2>About Me</h2>
    <p>Hello! I am learning HTML and this is my sample webpage.</p>

    <hr>

    <h2>My Hobbies</h2>
    <ul>
        <li>Reading</li>
        <li>Coding</li>
        <li>Music</li>
        <li>Gaming</li>
    </ul>

    <hr>

    <h2>Sample Table</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Place</th>
        </tr>
        <tr>
            <td>John</td>
            <td>20</td>
            <td>Hyderabad</td>
        </tr>
        <tr>
            <td>Sara</td>
            <td>22</td>
            <td>Delhi</td>
        </tr>
    </table>

    <hr>

    <h2>Click the Button</h2>
    <button onclick="showMsg()">Click Me</button>

    <script>
        function showMsg() {
            alert("Hello! This is a JavaScript alert.");
        }
    </script>

</body>
</html>
