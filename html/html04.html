<html>

<head>
    <title>form</title>
    <link rel="icon" type="image/png" href="image_link.png">
</head>

<body>
    <main>
        <section>
            <fieldset>
                <legend>MY form </legend> <br>
                <form>
                    NAME <input type="text" placeholder="enter your name"><br><br>
                    FNAME <input type="text" placeholder="enter your father name "><BR></BR>
                    mobile.no <input type="number" placeholder="mobile_number"><br><br>
                    password<input type="password"><br><br>
                    email<input type="email" placeholder="xyz@gmail.com"><br><br>
                    dob<input type="date"><br><br>
                    gender: <br>
                    <input type="radio" name="gender">male
                    <input type="radio" name="gender">female
                    <input type="radio" name="gender">other <br><br>
                    address: <br> <textarea placeholder="enter address"></textarea><br><br>
                    previous classes:
                    <input type="checkbox">10th
                    <input type="checkbox">11th
                    <input type="checkbox">12th
                    <input type="checkbox">none <br><br>
                    upload file <input type="file"><br><br>
                    choose state:
                    <select>
                        <option value="A.P">A.P</option>
                        <option value="telangana">telangana</option>
                        <option value="punjab">punjab</option>
                        <option value="H.P">H.P </option>
                    </select> <br><br>
                    <input type="button" value="submit">
                </form>
            </fieldset>
        </section>
        <ul>
            <li type="square">xyz</li>
            <li type="circle">abc</li>
            <li type="disc">123</li>
        </ul>
    </main>


</body>

</html>
